# CircleCI 2.1 configuration — modernized for faster, more reliable Maven builds
# Uses cimg/openjdk image, dependency caching, workflows, and optional remote Docker setup for Testcontainers
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:25.0
    working_directory: ~/repo
    environment:
      MAVEN_OPTS: -Xmx3200m
    steps:
      - checkout

      # Restore Maven cache (fallback to a generic key)
      - restore_cache:
          keys:
            - m2-deps-{{ checksum "pom.xml" }}
            - m2-deps-

      # If Testcontainers or Docker builds are required, uncomment the setup_remote_docker step below
      # - setup_remote_docker:
      #     version: default
      #     docker_layer_caching: true

      # Install build tools if the image doesn't include them (cimg images are Debian-based)
      - run:
          name: Install build tools
          command: |
            sudo apt-get update && sudo apt-get install -y maven make

      - run:
          name: Build (skip tests)
          command: mvn -B -DskipTests clean install

      - run:
          name: Run tests
          command: mvn test

      # Save Maven cache for subsequent runs
      - save_cache:
          paths:
            - ~/.m2
          key: m2-deps-{{ checksum "pom.xml" }}

workflows:
  build_and_test:
    jobs:
      - build

